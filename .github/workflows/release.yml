name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          make test+coverage

      - name: Build frontend
        run: |
          make build+frontend
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install go-selfupdate
        run: go install github.com/sanbornm/go-selfupdate/cmd/go-selfupdate@latest

      - name: Prepare update binaries
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _bin
          mkdir -p _bin

          tar -xOzf dist/ffmate_Darwin_arm64.tar.gz ffmate > _bin/darwin-arm64
          tar -xOzf dist/ffmate_Linux_x86_64.tar.gz ffmate > _bin/linux-amd64
          tar -xOzf dist/ffmate_Linux_arm64.tar.gz ffmate > _bin/linux-arm64
          tar -xOzf dist/ffmate_Darwin_x86_64.tar.gz ffmate > _bin/darwin-amd64

          unzip -p dist/ffmate_Windows_x86_64.zip ffmate.exe > _bin/windows-amd64
          unzip -p dist/ffmate_Windows_arm64.zip ffmate.exe > _bin/windows-arm64

          chmod +x _bin/darwin-* _bin/linux-*

      - name: Execute go-selfupdate
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _update
          mkdir -p _update

          VERSION="${GITHUB_REF_NAME}"

          ${GOPATH:-$HOME/go}/bin/go-selfupdate \
            -o=_update/ffmate \
            _bin/ \
            "$VERSION"

      - name: Upload update binaries to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY_SECRET }}
          AWS_REGION: ${{ secrets.S3_REGION }}
          AWS_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          DEST_DIR: "_update-test"
          SOURCE_DIR: "_update"